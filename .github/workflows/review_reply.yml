name: Everskin GBP Review Auto-Reply

on:
  schedule:
    # Runs every 6 hours: 12 AM, 6 AM, 12 PM, 6 PM IST
    # IST = UTC+5:30 → 12:30 AM, 6:30 AM, 12:30 PM, 6:30 PM UTC
    - cron: '30 18 * * *'   # 12:00 AM IST
    - cron: '0  1 * * *'    # 6:30 AM IST
    - cron: '0  7 * * *'    # 12:30 PM IST
    - cron: '0  13 * * *'   # 6:30 PM IST

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  reply-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # To commit updated reply log

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Write credentials from secrets ───────────────────────────────────
      - name: Setup credentials
        env:
          GBP_TOKEN_JSON:  ${{ secrets.GBP_TOKEN_JSON }}
          GBP_CONFIG_JSON: ${{ secrets.GBP_CONFIG_JSON }}
        run: |
          mkdir -p credentials data
          echo "$GBP_TOKEN_JSON"  > credentials/token.json
          echo "$GBP_CONFIG_JSON" > data/gbp_config.json

      # ── 5. Run review reply script ───────────────────────────────────────────
      - name: Run review auto-reply
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python review_reply.py

      # ── 6. Commit updated reply log ──────────────────────────────────────────
      - name: Save reply log
        run: |
          git config --local user.email "gbp-bot@everskin.co.in"
          git config --local user.name  "Everskin GBP Bot"
          git add data/review_reply_log.json
          git diff --staged --quiet || git commit -m "chore: update review reply log [skip ci]"
          git push
